<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учебный провайдер входа (имитация)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="idp">
  <header class="top"><h1>Учебный провайдер входа</h1><span class="badge">имитация OIDC</span></header>
  <main>
    <p class="notice">Это отдельная «сторона» протокола — Identity Provider. Пароль вводится только здесь, приложение его не видит.</p>
    <p id="status" role="status"></p>

    <section id="loginSection" class="card" hidden>
      <h2>Вход</h2>
      <form id="loginForm" novalidate>
        <label>Логин <input id="login" autocomplete="username"></label>
        <label>Пароль <input id="password" type="password" autocomplete="current-password"></label>
        <button type="submit">Войти</button>
      </form>
      <p class="hint">Тестовый аккаунт: <code>student</code> / <code>Test-Pass-123</code></p>
    </section>

    <section id="consentSection" class="card" hidden>
      <h2>Разрешить доступ?</h2>
      <p>Приложение «<strong id="clientName"></strong>» запрашивает доступ к данным:</p>
      <ul class="scopes" id="scopes"></ul>
      <div class="btnrow">
        <button id="allowBtn">Разрешить</button>
        <button id="denyBtn" class="secondary">Отклонить</button>
      </div>
    </section>

    <section id="errorSection" class="card" hidden>
      <h2>Некорректный запрос</h2>
      <p id="errorText"></p>
    </section>
  </main>
  <script src="crypto-utils.js"></script>
  <script src="idp-core.js"></script>
  <script src="provider.js"></script>
</body>
</html>
