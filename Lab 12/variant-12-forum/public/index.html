<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-форум</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Мини-форум</h1>
    <div id="guestBar"><span class="badge">Гость</span></div>
    <div id="userBar" hidden>
      <span class="badge user" id="userName"></span>
      <button id="logoutBtn" class="secondary">Выйти</button>
    </div>
  </header>

  <main>
    <p id="status" role="status"></p>

    <section id="loginSection" class="card">
      <h2>Вход для публикации</h2>
      <form id="loginForm" novalidate>
        <label>Логин <input id="login" autocomplete="username"></label>
        <label>Пароль <input id="password" type="password" autocomplete="current-password"></label>
        <button type="submit">Войти</button>
      </form>
      <p class="hint">Тестовые аккаунты: <code>alice</code> / <code>Test-Pass-111</code>, <code>bob</code> / <code>Test-Pass-222</code>, <code>moderator</code> / <code>Test-Pass-333</code></p>
    </section>

    <section id="composeSection" class="card" hidden>
      <h2>Новое сообщение</h2>
      <form id="postForm" novalidate>
        <label>Текст (до 500 символов)
          <textarea id="postText" maxlength="500"></textarea>
        </label>
        <button type="submit">Опубликовать</button>
      </form>
    </section>

    <section class="card">
      <h2>Сообщения</h2>
      <ul id="posts" class="list"></ul>
    </section>

    <section id="auditSection" class="card" hidden>
      <h2>Журнал входов (только модератор)</h2>
      <ul id="audit" class="list audit"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
