<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт расходов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Учёт расходов</h1>
    <form id="expenseForm">
      <select id="category">
        <option value="">Категория</option>
        <option>Еда</option><option>Транспорт</option><option>Жильё</option>
        <option>Развлечения</option><option>Учёба</option><option>Другое</option>
      </select>
      <input type="number" id="amount" placeholder="Сумма, ₸" min="0.01" step="0.01">
      <input type="date" id="date">
      <button type="submit">Добавить</button>
    </form>
    <p id="message" class="message" role="status"></p>
    <p class="total">Общий расход: <b id="total">0</b> ₸</p>
    <ul id="list" class="list"></ul>
    <div class="tools">
      <label for="mode">Хранилище:</label>
      <select id="mode">
        <option value="local">localStorage (постоянное)</option>
        <option value="session">sessionStorage (до закрытия вкладки)</option>
      </select>
      <button id="clearBtn" class="danger">Очистить всё</button>
    </div>
    <p class="info" id="modeInfo"></p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
