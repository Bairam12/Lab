<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список покупок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Список покупок</h1>
    <form id="addForm">
      <input type="text" id="itemInput" placeholder="Название товара" maxlength="60">
      <button type="submit">Добавить</button>
    </form>
    <p id="message" class="message" role="status"></p>
    <ul id="list" class="list"></ul>
    <p class="info">Товаров: <b id="count">0</b> · Куплено: <b id="boughtCount">0</b></p>
    <div class="tools">
      <button id="exportBtn" class="light">Экспорт в JSON</button>
      <button id="importBtn" class="light">Импорт из JSON</button>
      <button id="clearBtn" class="danger">Очистить список</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
