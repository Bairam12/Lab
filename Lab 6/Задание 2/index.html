<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таблица студентов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Таблица студентов</h1>
    <form id="studentForm">
      <input type="text" id="nameInput" placeholder="Имя студента" required>
      <input type="number" id="scoreInput" placeholder="Балл (0–100)" min="0" max="100" required>
      <button type="submit">Добавить</button>
    </form>
    <p id="message" class="message"></p>
    <input type="search" id="searchInput" placeholder="Поиск по имени...">
    <table>
      <thead><tr><th>№</th><th>Имя</th><th>Балл</th><th>Действие</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p class="info">Студентов: <b id="count">0</b> · Средний балл: <b id="average">—</b></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
