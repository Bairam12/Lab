<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация</title>
<style>
body{font-family:Arial,sans-serif;max-width:380px;margin:40px auto;padding:0 16px}
.field{margin-bottom:14px}label{display:block;margin-bottom:4px}
input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #999;border-radius:4px}
input.invalid{border-color:#c0392b}input.valid{border-color:#2e7d32}
.error{color:#c0392b;font-size:13px;min-height:16px}
#strength{font-size:13px}
button{padding:10px 18px;cursor:pointer}
#success{color:#2e7d32;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<h1>Регистрация</h1>
<form id="form" novalidate>
  <div class="field"><label for="name">Имя</label>
    <input id="name" type="text"><div class="error" id="nameError"></div></div>
  <div class="field"><label for="email">Email</label>
    <input id="email" type="email"><div class="error" id="emailError"></div></div>
  <div class="field"><label for="password">Пароль</label>
    <input id="password" type="password"><div id="strength"></div>
    <div class="error" id="passwordError"></div></div>
  <button type="submit">Зарегистрироваться</button>
</form>
<p id="success"></p>
<script src="zadanie19_script.js"></script>
</body>
</html>
