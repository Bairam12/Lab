<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай число</title>
<style>
body{font-family:Arial,sans-serif;max-width:420px;margin:40px auto;padding:0 16px}
input{padding:8px;width:90px}button{padding:8px 14px;cursor:pointer}
#hint{font-weight:bold;min-height:24px}
.win{color:#2e7d32}.low{color:#1565c0}.high{color:#c62828}
</style>
</head>
<body>
<h1>Угадай число</h1>
<p>Я загадал число от 1 до 100.</p>
<input type="number" id="guess" placeholder="Ваше число">
<button id="check">Проверить</button>
<button id="restart">Новая игра</button>
<p id="hint"></p>
<p id="attempts">Попыток: 0</p>
<p>История:</p>
<ol id="history"></ol>
<script src="zadanie15_script.js"></script>
</body>
</html>
